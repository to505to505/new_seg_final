[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ODySSeI"
authors = [
  { name = "andy-joy-25", email = "anand.choudhary@alumni.epfl.ch" }
]
description = "An Open-Source End-to-End Framework for Automated Detection, Segmentation, and Severity Estimation of Lesions in Invasive Coronary Angiography Images"
version = "0.0.1"
readme = "README.md"
requires-python = "<3.12,>=3.11"
dependencies = [
  "numpy==1.24.4",
  "scipy==1.11.4",
  "matplotlib==3.9.2",
  "opencv-python-headless==4.10.0.84",
  "pandas==2.1.4",
  "kornia==0.7.0",
  "albumentations==1.4.3",
  "wandb==0.18.7",
  "scikit-image==0.24.0",
  "ultralytics==8.3.59",
  "Pillow==10.2.0",
  "torch==2.4.1",
  "torchvision==0.19.1",
  "tqdm==4.65.0",
  "scikit-learn==1.3.2",
  "pydicom",
  "timm",
  "lightning",
  "streamlit",
  "pyyaml",
]

[project.scripts]
odyssei = "odyssei.cli:main"

[project.urls]
"Homepage" = "https://github.com/LTS4/ODySSeI"

[tool.setuptools]
packages = ["odyssei", "odyssei.models", "odyssei.utils"]