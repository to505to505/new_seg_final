trainer:
  max_epochs: 100
  check_val_every_n_epoch: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: runs
      name: coronary_instance_eomt_small_512_dinov2_semi
model:
  class_path: training.semi_supervised_instance.SemiSupervisedInstance
  init_args:
    attn_mask_annealing_enabled: True
    attn_mask_annealing_start_steps: [2960, 7400, 11840]
    attn_mask_annealing_end_steps: [7400, 11840, 14800]
    warmup_steps: [296, 592]
    skeleton_coefficient: 1.0
    # Semi-supervised parameters
    ema_momentum_max: 0.996
    conf_threshold: 0.95
    unsupervised_weight: 1.0
    score_threshold: 0.5
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 100
        num_blocks: 3
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_dinov2.lvd142m
            patch_size: 14
data:
  class_path: datasets.semi_supervised_data_module.SemiSupervisedDataModule
  init_args:
    batch_size: 8
    path: /home/dsa/new_seg_final/single_dataset
    unlabeled_path: /home/dsa/new_seg_final/cadica_base
    color_jitter_enabled: true
    skeleton_enabled: true
    skeleton_num_dilations: 2
    extra_augmentations_enabled: true
