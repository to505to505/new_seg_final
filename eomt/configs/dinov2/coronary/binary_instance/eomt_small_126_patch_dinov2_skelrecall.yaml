trainer:
  max_epochs: 100
  check_val_every_n_epoch: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: runs
      name: coronary_binary_eomt_small_126_patch_dinov2_skelrecall
model:
  class_path: training.mask_classification_instance.MaskClassificationInstance
  init_args:
    attn_mask_annealing_enabled: True
    attn_mask_annealing_start_steps: [5460, 13650, 21840]
    attn_mask_annealing_end_steps: [13650, 21840, 27300]
    warmup_steps: [546, 1092]
    skeleton_coefficient: 1.0
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 100
        num_blocks: 3
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_dinov2.lvd142m
            patch_size: 14
data:
  class_path: datasets.coronary_binary_instance.CoronaryBinaryInstance
  init_args:
    path: /home/dsa/new_seg_final/patch_dataset
    batch_size: 16
    img_size:
      - 126
      - 126
    scale_range:
      - 0.8
      - 1.2
    skeleton_enabled: true
    skeleton_num_dilations: 1
    extra_augmentations_enabled: true
